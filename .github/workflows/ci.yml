name: CI

# Lint and static analysis on every pull request to main and every push to
# development. The release workflows re-use the same checks before building.
on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  php:
    name: PHPCS + PHPStan + composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer, cs2pr

      - uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json', 'composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPCS (WordPress-Extra, PHP 7.4+ compatibility)
        run: ./vendor/bin/phpcs --report=checkstyle -q | cs2pr

      - name: PHPStan (level 6)
        run: ./vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Audit dependencies for known CVEs
        run: composer audit

  assets:
    name: ESLint + Stylelint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Switch to `npm ci` (and add `cache: npm` above) once package-lock.json is committed.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
