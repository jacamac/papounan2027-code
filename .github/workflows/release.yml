name: Release

# Push a version tag on main to publish a release:
#   git tag v0.2.0 && git push origin v0.2.0
# The version is injected from the tag; release notes come from the matching
# "= x.y.z =" section of readme.txt. Production sites see the update in
# WordPress (Plugin Update Checker).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & publish release
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the source version matches the tag
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          header=$(sed -n 's/^ \* Version: *//p' papounan-site.php | head -n1 | tr -d '[:space:]')
          const=$(sed -n "s/.*'PAPOUNAN_SITE_VERSION', *'\([^']*\)'.*/\1/p" papounan-site.php | head -n1)
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt | head -n1 | tr -d '[:space:]')
          status=0
          for pair in "Version header=${header}" "PAPOUNAN_SITE_VERSION=${const}" "Stable tag=${stable}"; do
            if [ "${pair#*=}" != "$VERSION" ]; then
              echo "::error::${pair%%=*} is '${pair#*=}' but the tag is v${VERSION}. Run tools/bump-version.sh ${VERSION}, commit, then re-tag."
              status=1
            fi
          done
          exit "$status"

      - name: Check the changelog has an entry for this version
        run: grep -q "^= ${{ steps.version.outputs.VERSION }} =" readme.txt

      - name: Build zip
        run: bash tools/build-zip.sh "${{ steps.version.outputs.VERSION }}"

      - name: Release notes from readme.txt
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          {
            echo "## What's new in ${VERSION}"
            echo
            awk "/^= ${VERSION} =/{found=1;next} found && /^= /{exit} found && NF{print}" readme.txt
            echo
            echo "Install: WordPress → Plugins → Add New → Upload Plugin, or update from the Plugins screen."
          } > build/release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Papounan Site ${{ steps.version.outputs.VERSION }}
          body_path: build/release-notes.md
          files: build/papounan-site.zip
          prerelease: false
          make_latest: true
